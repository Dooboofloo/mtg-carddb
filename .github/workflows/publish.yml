# Publishing runs only when the maintainer manually starts this workflow.
name: Publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing release tag to publish (for example, v0.1.0)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify and build tagged release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Validate tag input
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a version tag like v0.1.0" >&2
            exit 1
          fi

      - name: Check out the requested tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Confirm tag matches package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          import tomllib

          project = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]
          actual = os.environ["RELEASE_TAG"]
          expected = f"v{project['version']}"
          if actual != expected:
              raise SystemExit(f"Tag {actual!r} does not match package version {expected!r}")
          if project["name"] != "mtg-carddb":
              raise SystemExit("Unexpected distribution name")
          PY

      - name: Install development dependencies
        run: python -m pip install -e ".[dev]"

      - name: Run offline tests
        run: python -m pytest -q --disable-socket

      - name: Build wheel and source distribution
        run: python -m build

      - name: Check distribution metadata and count
        shell: bash
        run: |
          python -m twine check --strict dist/*
          python - <<'PY'
          from pathlib import Path
          files = list(Path("dist").iterdir())
          wheels = [p for p in files if p.suffix == ".whl"]
          sdists = [p for p in files if p.name.endswith(".tar.gz")]
          if len(files) != 2 or len(wheels) != 1 or len(sdists) != 1:
              raise SystemExit(f"Expected one wheel and one sdist; found: {[p.name for p in files]}")
          PY

      - name: Save validated distributions
        uses: actions/upload-artifact@v7
        with:
          name: mtg-carddb-release-dists
          path: dist/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish validated distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/mtg-carddb/
    permissions:
      id-token: write
    steps:
      - name: Download validated distributions
        uses: actions/download-artifact@v7
        with:
          name: mtg-carddb-release-dists
          path: dist/

      - name: Publish to PyPI using Trusted Publishing
        uses: pypa/gh-action-pypi-publish@release/v1
