[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "mtg-carddb"
version = "0.1.0"
description = "Indexed Magic: The Gathering card queries using set operations"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-socket>=0.7",
    "build>=1.2",
    "twine>=6",
]

[project.scripts]
mtg-carddb = "mtg_carddb.cli:main"

[project.urls]
Repository = "https://github.com/Dooboofloo/mtg-carddb"
Issues = "https://github.com/Dooboofloo/mtg-carddb/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/mtg_carddb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]